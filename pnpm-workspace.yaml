packages:
  - "apps/*"
  - "packages/*"

# Centralized versions - all packages reference these via "catalog:"
# to prevent version drift across the monorepo.
catalog:
  # Core framework. Next stays on the 16.4 patch line (~). 16.3 has no fix for
  # the two critical RCE advisories of October 2026 (image optimisation and
  # `use cache`, fixed in 16.4.1), nor for the cache and Edge cookie leaks
  # fixed in 16.4.5. @next/eslint-plugin-next follows the same line.
  next: "~16.4.6"
  react: "^19.3.0"
  react-dom: "^19.3.0"

  # TypeScript
  typescript: "^5.8.3"
  "@types/node": "^26.6.6"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"

  # Database & Auth
  prisma: "^7.10.1"
  "@prisma/client": "^7.10.1"
  "@prisma/adapter-pg": "^7.10.1"
  "@supabase/supabase-js": "^2.119.0"
  "@supabase/ssr": "^0.6.1"

  # Validation
  zod: "^4.6.7"
  "@t3-oss/env-nextjs": "^0.13.11"

  # Logging
  pino: "^10.4.0"

  # Styling
  tailwindcss: "^4.3.5"
  "@tailwindcss/postcss": "^4.3.5"
  "class-variance-authority": "^0.7.1"
  "clsx": "^2.1.1"
  "tailwind-merge": "^3.7.0"

  # Theme
  "next-themes": "^0.4.6"

  # Animation
  remotion: "4.0.544"
  "@remotion/cli": "4.0.544"
  "@remotion/player": "4.0.544"

  # Server state (the mobile app; the site reads on the server)
  "@tanstack/react-query": "^5.107.2"

  # Icons & UI primitives
  "lucide-react": "^1.74.0"
  "sonner": "^2.0.8"

  # Radix UI primitives (used by shadcn components)
  "@radix-ui/react-avatar": "^1.3.1"
  "@radix-ui/react-dialog": "^1.3.1"
  "@radix-ui/react-progress": "^1.2.1"
  "@radix-ui/react-separator": "^1.2.0"
  "@radix-ui/react-slot": "^1.5.0"
  "@radix-ui/react-tooltip": "^1.4.1"

  # Email
  resend: "^6.38.1"
  "@react-email/components": "^1.0.12"

  # Rate limiting
  "@upstash/ratelimit": "^2.2.1"
  "@upstash/redis": "^1.41.0"

  # Monaco Editor
  "@monaco-editor/react": "^4.7.0"

  # MDX
  "next-mdx-remote": "^6.0.0"
  "remark-gfm": "^4.0.0"
  "rehype-highlight": "^7.0.0"
  "gray-matter": "^4.0.3"
  "@mdx-js/mdx": "^3.1.0"

  # Notes workspace: the markdown editor (CodeMirror 6, without lang-markdown,
  # whose HTML, CSS and JS grammars the notes do not need: the highlighting is
  # the workspace's own), code colouring in the preview and the PDF (the same
  # lowlight and highlight.js rehype-highlight already pulls in), and the .zip
  # export and import (fflate: no dependency, already under pdfkit).
  "@codemirror/autocomplete": "^6.20.4"
  "@codemirror/commands": "^6.11.1"
  "@codemirror/search": "^6.7.2"
  "@codemirror/state": "^6.7.6"
  "@codemirror/view": "^6.43.15"
  lowlight: "^3.3.0"
  fflate: "^0.8.3"

  # Lesson exercises: photo metadata, maps without external tiles, network canvas
  exifr: "^7.1.3"
  leaflet: "^1.9.4"
  "@types/leaflet": "^1.9.22"
  "@xyflow/react": "^12.12.0"

  # JWT lab (lesson exercise): ECDSA in pure JS for the site and the app, and the
  # reference JOSE library the tests check the lab against. jose needs WebCrypto,
  # which the app's JavaScript engine does not have, so it stays out of the shipped code.
  "@noble/curves": "^2.4.0"
  jose: "^6.2.17"

  # Typography (Tailwind plugin - used in apps/web for lesson content)
  "@tailwindcss/typography": "^0.5.20"

  # Monitoring
  "@sentry/nextjs": "^11.13.0"

  # Testing
  vitest: "^5.0.5"
  "@vitest/coverage-v8": "^5.0.5"
  "@testing-library/react": "^16.3.3"
  "@testing-library/jest-dom": "^7.0.1"
  "jsdom": "^30.1.1"

  # Linting & formatting
  eslint: "^10.15.0"
  "@eslint/js": "^10.0.1"
  "typescript-eslint": "^8.73.0"
  "eslint-plugin-react": "^7.37.5"
  "eslint-plugin-react-hooks": "^7.1.1"
  "@next/eslint-plugin-next": "~16.4.6"
  "@biomejs/biome": "^2.6.8"

  # Git hooks
  husky: "^9.1.7"
  "lint-staged": "^17.6.1"
  "@commitlint/cli": "^21.2.4"
  "@commitlint/config-conventional": "^21.2.4"
