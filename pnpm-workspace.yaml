packages:
  - "apps/*"
  - "packages/*"

# Centralized versions — all packages reference these via "catalog:"
# to prevent version drift across the monorepo.
catalog:
  # Core framework
  next: "^15.3.1"
  react: "^19.1.0"
  react-dom: "^19.1.0"

  # TypeScript
  typescript: "^5.8.3"
  "@types/node": "^22.15.3"
  "@types/react": "^19.1.2"
  "@types/react-dom": "^19.1.2"

  # Database & Auth
  prisma: "^6.7.0"
  "@prisma/client": "^6.7.0"
  "@supabase/supabase-js": "^2.49.4"
  "@supabase/ssr": "^0.6.1"

  # Validation
  zod: "^3.24.3"
  "@t3-oss/env-nextjs": "^0.12.0"

  # Styling
  tailwindcss: "^4.1.4"
  "@tailwindcss/postcss": "^4.1.4"

  # Animation
  "framer-motion": "^12.9.2"

  # State & forms
  "@tanstack/react-query": "^5.74.4"
  "react-hook-form": "^7.55.0"
  "@hookform/resolvers": "^5.0.1"

  # Email
  resend: "^4.5.1"
  "@react-email/components": "^0.0.36"

  # Rate limiting
  "@upstash/ratelimit": "^2.0.5"
  "@upstash/redis": "^1.34.8"

  # MDX
  "next-mdx-remote": "^5.0.0"

  # Monitoring
  "@sentry/nextjs": "^9.14.0"

  # i18n
  "next-intl": "^4.1.0"

  # Testing
  vitest: "^3.1.2"
  "@vitest/coverage-v8": "^3.1.2"
  "@testing-library/react": "^16.3.0"
  "@testing-library/jest-dom": "^6.6.3"
  "jsdom": "^26.1.0"
  "msw": "^2.7.5"

  # Playwright (e2e — installed only in CI/test context)
  "@playwright/test": "^1.51.1"

  # Linting & formatting
  eslint: "^9.25.1"
  "@eslint/js": "^9.25.1"
  "typescript-eslint": "^8.30.1"
  "eslint-plugin-react": "^7.37.5"
  "eslint-plugin-react-hooks": "^5.2.0"
  "@next/eslint-plugin-next": "^15.3.1"
  "@biomejs/biome": "^1.9.4"

  # Git hooks
  husky: "^9.1.7"
  "lint-staged": "^15.5.1"
  "@commitlint/cli": "^19.8.0"
  "@commitlint/config-conventional": "^19.8.0"
