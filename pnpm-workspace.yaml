packages:
  - "apps/*"
  - "packages/*"

# Centralized versions - all packages reference these via "catalog:"
# to prevent version drift across the monorepo.
catalog:
  # Core framework
  next: "^15.5.26"
  react: "^19.3.0"
  react-dom: "^19.3.0"

  # TypeScript
  typescript: "^5.8.3"
  "@types/node": "^22.15.3"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"

  # Database & Auth
  prisma: "^6.7.0"
  "@prisma/client": "^6.7.0"
  "@supabase/supabase-js": "^2.49.4"
  "@supabase/ssr": "^0.6.1"

  # Validation
  zod: "^3.24.3"
  "@t3-oss/env-nextjs": "^0.12.0"

  # Styling
  tailwindcss: "^4.3.3"
  "@tailwindcss/postcss": "^4.3.3"
  "class-variance-authority": "^0.7.1"
  "clsx": "^2.1.1"
  "tailwind-merge": "^3.7.0"

  # Theme
  "next-themes": "^0.4.6"

  # Animation
  remotion: "4.0.496"
  "@remotion/cli": "4.0.496"

  # Server state (the mobile app; the site reads on the server)
  "@tanstack/react-query": "^5.104.0"

  # Icons & UI primitives
  "lucide-react": "^1.48.0"
  "sonner": "^2.0.8"

  # Radix UI primitives (used by shadcn components)
  "@radix-ui/react-avatar": "^1.2.6"
  "@radix-ui/react-dialog": "^1.1.23"
  "@radix-ui/react-progress": "^1.1.16"
  "@radix-ui/react-separator": "^1.1.15"
  "@radix-ui/react-slot": "^1.3.3"
  "@radix-ui/react-tooltip": "^1.2.16"

  # Email
  resend: "^4.5.1"
  "@react-email/components": "^0.0.36"

  # Rate limiting
  "@upstash/ratelimit": "^2.2.0"
  "@upstash/redis": "^1.39.0"

  # Monaco Editor
  "@monaco-editor/react": "^4.7.0"

  # MDX
  "next-mdx-remote": "^6.0.0"
  "remark-gfm": "^4.0.0"
  "rehype-highlight": "^7.0.0"
  "gray-matter": "^4.0.3"
  "@mdx-js/mdx": "^3.1.0"

  # Typography (Tailwind plugin - used in apps/web for lesson content)
  "@tailwindcss/typography": "^0.5.20"

  # Monitoring
  "@sentry/nextjs": "^9.14.0"

  # Testing
  vitest: "^5.0.2"
  "@vitest/coverage-v8": "^5.0.2"
  "@testing-library/react": "^16.3.3"
  "@testing-library/jest-dom": "^7.0.1"
  "jsdom": "^30.1.1"

  # Linting & formatting
  eslint: "^10.11.0"
  "@eslint/js": "^10.0.1"
  "typescript-eslint": "^8.70.1"
  "eslint-plugin-react": "^7.37.5"
  "eslint-plugin-react-hooks": "^7.1.1"
  "@next/eslint-plugin-next": "^15.5.26"
  "@biomejs/biome": "^2.5.14"

  # Git hooks
  husky: "^9.1.7"
  "lint-staged": "^17.6.0"
  "@commitlint/cli": "^21.2.3"
  "@commitlint/config-conventional": "^21.2.3"
