<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyber Learn — Initialisation</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { height: 100%; }
  body {
    background: #030219;
    overflow: hidden;
    position: relative;
  }

  /* Subtle radial glow behind logo */
  body::before {
    content: '';
    position: absolute;
    left: 50%; top: 38%;
    width: 900px; height: 900px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(10,255,212,0.10) 0%, rgba(10,255,212,0.04) 30%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Faint scanline grid for atmosphere */
  body::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(0deg, rgba(10,255,212,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(10,255,212,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .splash {
    position: relative;
    z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 48px 64px;
  }

  .splash__center {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* ---------- LOGO ---------- */
  .logo {
    width: 180px; height: 200px;
    position: relative;
    margin-bottom: 36px;
    filter: drop-shadow(0 0 30px rgba(10,255,212,0.35)) drop-shadow(0 0 60px rgba(10,255,212,0.15));
    animation: logoFloat 4s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 30px rgba(10,255,212,0.35)) drop-shadow(0 0 60px rgba(10,255,212,0.15)); }
    50%      { transform: translateY(-4px); filter: drop-shadow(0 0 38px rgba(10,255,212,0.55)) drop-shadow(0 0 80px rgba(10,255,212,0.22)); }
  }

  .logo svg { width: 100%; height: 100%; display: block; }
  .logo__shield { stroke: #0AFFD4; fill: rgba(10,255,212,0.04); }
  .logo__shield-inner { stroke: rgba(10,255,212,0.4); fill: none; }
  .logo__key { stroke: #0AFFD4; fill: none; }
  .logo__key-glow { fill: #0AFFD4; }
  .logo__node { fill: #0AFFD4; }
  .logo__node--blue { fill: #6E8BFF; }
  .logo__edge { stroke: rgba(10,255,212,0.35); }
  .logo__sweep {
    transform-origin: 50% 50%;
    animation: sweep 2.4s linear infinite;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .logo__pulse-ring {
    fill: none;
    stroke: #0AFFD4;
    stroke-width: 1;
    opacity: 0;
    transform-origin: 50% 50%;
    animation: pulseRing 2.8s ease-out infinite;
  }
  .logo__pulse-ring--2 { animation-delay: 1.4s; }
  @keyframes pulseRing {
    0%   { opacity: 0.6; transform: scale(0.6); }
    100% { opacity: 0;   transform: scale(1.4); }
  }

  .logo__node-pulse {
    animation: nodePulse 1.6s ease-in-out infinite;
    transform-origin: center;
  }
  .logo__node-pulse--b { animation-delay: 0.4s; }
  .logo__node-pulse--c { animation-delay: 0.8s; }
  .logo__node-pulse--d { animation-delay: 1.2s; }
  @keyframes nodePulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }

  /* ---------- WORDMARK ---------- */
  .wordmark {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.42em;
    color: #F5F5FA;
    margin: 0 0 6px;
    padding-left: 0.42em; /* visual centering for tracking */
  }
  .wordmark__sep { color: #0AFFD4; }

  .tagline {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #6F6B99;
    margin-bottom: 56px;
    padding-left: 0.32em;
  }

  /* ---------- LOADING BAR ---------- */
  .loader {
    width: min(560px, 70vw);
    margin-bottom: 22px;
  }
  .loader__bar {
    position: relative;
    height: 2px;
    width: 100%;
    background: rgba(42,37,96,0.6);
    overflow: hidden;
  }
  .loader__bar::before {
    content: '';
    position: absolute;
    left: 0; top: -1px;
    width: 1px; height: 4px;
    background: #0AFFD4;
    box-shadow: 0 0 6px #0AFFD4;
  }
  .loader__bar::after {
    content: '';
    position: absolute;
    right: 0; top: -1px;
    width: 1px; height: 4px;
    background: rgba(42,37,96,0.9);
  }
  .loader__fill {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
      rgba(0,36,255,0.6) 0%,
      #0AFFD4 60%,
      #FFFFFF 100%);
    box-shadow: 0 0 10px rgba(10,255,212,0.7), 0 0 20px rgba(10,255,212,0.4);
    animation: fill 4.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  .loader__fill::after {
    content: '';
    position: absolute;
    right: 0; top: -3px; bottom: -3px;
    width: 12px;
    background: linear-gradient(90deg, transparent, #0AFFD4);
    filter: blur(2px);
  }
  @keyframes fill {
    0%   { width: 0%; }
    55%  { width: 78%; }
    85%  { width: 96%; }
    100% { width: 100%; }
  }

  .loader__meta {
    display: flex; justify-content: space-between;
    margin-top: 10px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #44406B;
  }
  .loader__meta b { color: #0AFFD4; font-weight: 600; }

  /* ---------- STATUS LINES ---------- */
  .status {
    width: min(560px, 70vw);
    height: 22px;
    position: relative;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .status__line {
    position: absolute; inset: 0;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    color: #B8B5D1;
    letter-spacing: 0.04em;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    animation: lineCycle 9s ease-in-out infinite;
  }
  .status__line .arrow { color: #0AFFD4; margin-right: 8px; }
  .status__line .ok { color: #0AFFD4; margin-left: 10px; }

  .status__line:nth-child(1) { animation-delay: 0s; }
  .status__line:nth-child(2) { animation-delay: 3s; }
  .status__line:nth-child(3) { animation-delay: 6s; }

  @keyframes lineCycle {
    0%   { opacity: 0; transform: translateY(8px); }
    4%   { opacity: 1; transform: translateY(0); }
    30%  { opacity: 1; transform: translateY(0); }
    34%  { opacity: 0; transform: translateY(-8px); }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  /* ---------- BOTTOM ---------- */
  .splash__foot {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #44406B;
  }
  .splash__foot-build {
    display: inline-flex; align-items: center; gap: 8px;
  }
  .splash__foot-build::before {
    content: '';
    width: 6px; height: 6px;
    background: #0AFFD4;
    box-shadow: 0 0 6px #0AFFD4;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .splash__foot-id {
    color: #0AFFD4;
  }
  .splash__foot-mid {
    flex: 1;
    text-align: center;
    color: #6F6B99;
  }
  .splash__foot-mid b { color: #B8B5D1; font-weight: 500; }
</style>
</head>
<body>
<div class="splash">
  <div class="splash__center">
    <div class="logo">
      <svg viewBox="0 0 180 200" fill="none">
        <!-- Pulse rings -->
        <circle class="logo__pulse-ring" cx="90" cy="100" r="60" />
        <circle class="logo__pulse-ring logo__pulse-ring--2" cx="90" cy="100" r="60" />

        <!-- Outer shield -->
        <path class="logo__shield"
          d="M90 8 L160 32 L160 100 C160 140 130 175 90 192 C50 175 20 140 20 100 L20 32 Z"
          stroke-width="1.5" />
        <!-- Inner shield -->
        <path class="logo__shield-inner"
          d="M90 22 L148 41 L148 100 C148 134 122 162 90 178 C58 162 32 134 32 100 L32 41 Z"
          stroke-width="1" />

        <!-- Neural network mesh -->
        <g>
          <line class="logo__edge" x1="90" y1="50" x2="55" y2="80" stroke-width="0.8" />
          <line class="logo__edge" x1="90" y1="50" x2="125" y2="80" stroke-width="0.8" />
          <line class="logo__edge" x1="55" y1="80" x2="90" y2="100" stroke-width="0.8" />
          <line class="logo__edge" x1="125" y1="80" x2="90" y2="100" stroke-width="0.8" />
          <line class="logo__edge" x1="55" y1="80" x2="125" y2="80" stroke-width="0.8" />
          <line class="logo__edge" x1="55" y1="80" x2="65" y2="135" stroke-width="0.8" />
          <line class="logo__edge" x1="125" y1="80" x2="115" y2="135" stroke-width="0.8" />
          <line class="logo__edge" x1="65" y1="135" x2="115" y2="135" stroke-width="0.8" />
          <line class="logo__edge" x1="90" y1="100" x2="65" y2="135" stroke-width="0.8" />
          <line class="logo__edge" x1="90" y1="100" x2="115" y2="135" stroke-width="0.8" />

          <!-- Mesh nodes -->
          <circle class="logo__node logo__node-pulse" cx="90" cy="50" r="3" />
          <circle class="logo__node logo__node--blue logo__node-pulse logo__node-pulse--b" cx="55" cy="80" r="2.5" />
          <circle class="logo__node logo__node--blue logo__node-pulse logo__node-pulse--b" cx="125" cy="80" r="2.5" />
          <circle class="logo__node logo__node-pulse logo__node-pulse--c" cx="65" cy="135" r="2.5" />
          <circle class="logo__node logo__node-pulse logo__node-pulse--c" cx="115" cy="135" r="2.5" />
        </g>

        <!-- Keyhole — central, larger, on top of mesh -->
        <g>
          <!-- Backing rect to "punch out" the keyhole from mesh visually -->
          <rect x="78" y="86" width="24" height="36" fill="#030219" />
          <!-- Keyhole circle -->
          <circle class="logo__key" cx="90" cy="95" r="7.5" stroke-width="1.6" />
          <circle class="logo__key-glow" cx="90" cy="95" r="3" />
          <!-- Keyhole stem -->
          <path class="logo__key-glow"
            d="M86 100 L88 118 L92 118 L94 100 Z" />
        </g>

        <!-- Sweep line -->
        <g class="logo__sweep">
          <line x1="90" y1="100" x2="90" y2="40"
            stroke="url(#sweepGrad)" stroke-width="1.2" />
        </g>

        <defs>
          <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0AFFD4" stop-opacity="0" />
            <stop offset="100%" stop-color="#0AFFD4" stop-opacity="0.8" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1 class="wordmark">CYBER<span class="wordmark__sep">_</span>LEARN</h1>
    <p class="tagline">Train · Hack · Defend</p>

    <div class="loader">
      <div class="loader__bar">
        <div class="loader__fill"></div>
      </div>
      <div class="loader__meta">
        <span>boot · 0x4A</span>
        <span><b>secure</b> handshake</span>
      </div>
    </div>

    <div class="status">
      <div class="status__line"><span class="arrow">›</span>Initialisation du système...</div>
      <div class="status__line"><span class="arrow">›</span>Chargement des modules...<span class="ok">[ok]</span></div>
      <div class="status__line"><span class="arrow">›</span>Connexion sécurisée établie...<span class="ok">[ok]</span></div>
    </div>
  </div>

  <div class="splash__foot">
    <span class="splash__foot-build">v2.4 · OPS · FR</span>
    <span class="splash__foot-mid">© 2026 · <b>cyberlearn.fr</b> · all systems nominal</span>
    <span class="splash__foot-id">node · paris-03</span>
  </div>
</div>
</body>
</html>
