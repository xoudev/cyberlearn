<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skeleton Loading States — Cyber Learn</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  body {
    background: #030219;
    min-height: 100vh;
    padding: 56px 64px 96px;
  }

  .page {
    max-width: 1320px;
    margin: 0 auto;
    display: flex; flex-direction: column;
    gap: 72px;
  }

  .page__head {
    border-bottom: 1px solid #2A2560;
    padding-bottom: 18px;
    margin-bottom: 0;
  }
  .page__title {
    font-family: 'Geist', system-ui, sans-serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.025em;
    color: #F5F5FA;
    margin: 0 0 8px;
  }
  .page__subtitle {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: #6F6B99;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin: 0;
  }
  .page__subtitle::before { content: '› '; color: #0AFFD4; }

  .section {
    display: flex; flex-direction: column;
    gap: 20px;
  }
  .section__tag {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: #0AFFD4;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #1A1640;
  }
  .section__tag-meta {
    color: #44406B;
    font-weight: 500;
    margin-left: auto;
  }

  /* ==========================================================================
     SHIMMER PRIMITIVE
     ========================================================================== */
  .sk {
    position: relative;
    background: #1F1B47;
    overflow: hidden;
    display: block;
  }
  .sk::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(42, 37, 96, 0.0) 20%,
      rgba(42, 37, 96, 0.95) 50%,
      rgba(42, 37, 96, 0.0) 80%,
      transparent 100%
    );
    animation: shimmer 1.6s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Variants */
  .sk--line { height: 14px; }
  .sk--line-lg { height: 24px; }
  .sk--line-xl { height: 38px; }
  .sk--line-sm { height: 10px; }
  .sk--pill {
    height: 20px; width: 80px;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 100%, 0 100%);
  }
  .sk--block { height: 140px; }

  /* Hexagonal skeleton */
  .sk--hex {
    width: 140px; height: 160px;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: #1F1B47;
  }

  /* Container card baseline */
  .card {
    border: 1px solid #2A2560;
    background: #0A0826;
    padding: 24px;
    position: relative;
  }
  .card--corners::before,
  .card--corners::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border-color: #0AFFD4;
    opacity: 0.5;
  }
  .card--corners::before {
    top: -1px; left: -1px;
    border-top: 1.5px solid;
    border-left: 1.5px solid;
  }
  .card--corners::after {
    bottom: -1px; right: -1px;
    border-bottom: 1.5px solid;
    border-right: 1.5px solid;
  }

  /* ==========================================================================
     1. DASHBOARD SKELETON
     ========================================================================== */
  .dash-sk {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 24px;
  }
  .dash-sk__welcome {
    padding: 28px 28px 32px;
  }
  .dash-sk__welcome .sk--line-xl { width: 62%; margin-bottom: 14px; }
  .dash-sk__welcome .sk--line { width: 36%; }

  .dash-sk__xp { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .dash-sk__xp .sk--line-sm { width: 50%; }
  .dash-sk__xp .sk--block { height: 36px; }
  .dash-sk__xp .sk--line { width: 75%; }

  .dash-sk__continue {
    grid-column: 1 / -1;
    padding: 28px;
    display: grid;
    grid-template-columns: 200px 1fr auto;
    gap: 24px;
    align-items: center;
  }
  .dash-sk__continue .sk--block { height: 110px; width: 100%; }
  .dash-sk__continue .lines { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .dash-sk__continue .lines .sk--line-sm { width: 90px; }
  .dash-sk__continue .lines .sk--line-lg { width: 70%; }
  .dash-sk__continue .lines .sk--line { width: 90%; }
  .dash-sk__continue .lines .sk--line.short { width: 55%; }
  .dash-sk__continue .cta { width: 160px; height: 52px; }

  /* ==========================================================================
     2. LESSON CARDS SKELETON
     ========================================================================== */
  .cards-sk {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .card-sk {
    padding: 0;
    display: flex; flex-direction: column;
  }
  .card-sk__cover {
    height: 160px; width: 100%;
    border-bottom: 1px solid #2A2560;
    position: relative;
  }
  .card-sk__cover::before {
    /* tiny diagonal accent bar to differentiate cover area */
    content: '';
    position: absolute;
    top: 12px; left: 12px;
    width: 32px; height: 14px;
    background: #14113D;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 100%, 0 100%);
    z-index: 1;
  }
  .card-sk__body {
    padding: 20px 22px 22px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .card-sk__body .sk--line-lg { width: 80%; }
  .card-sk__body .sk--line { width: 100%; }
  .card-sk__body .sk--line.short { width: 65%; }
  .card-sk__pills {
    display: flex; gap: 8px;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid #1A1640;
  }
  .card-sk__pills .sk--pill { width: 68px; height: 18px; }
  .card-sk__pills .sk--pill.wider { width: 90px; }
  .card-sk__pills .sk--pill.narrow { width: 48px; }

  /* ==========================================================================
     3. LESSON DETAIL SKELETON
     ========================================================================== */
  .ld-sk {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(360px, 1fr);
    gap: 48px;
  }
  .ld-sk__hero { display: flex; flex-direction: column; gap: 20px; }
  .ld-sk__crumb { width: 220px; height: 28px; }
  .ld-sk__tags { display: flex; gap: 8px; margin-top: 6px; }
  .ld-sk__tags .sk--pill { width: 96px; height: 22px; }
  .ld-sk__tags .sk--pill.b { width: 120px; }
  .ld-sk__tags .sk--pill.c { width: 80px; }
  .ld-sk__heading {
    height: 64px; width: 90%;
    margin-top: 4px;
  }
  .ld-sk__heading2 {
    height: 64px; width: 70%;
  }
  .ld-sk__lede { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; max-width: 560px; }
  .ld-sk__lede .sk--line { width: 100%; }
  .ld-sk__lede .sk--line.short { width: 65%; }

  .ld-sk__brief {
    padding: 20px 20px 22px;
    display: flex; flex-direction: column; gap: 18px;
    align-self: start;
  }
  .ld-sk__brief-head {
    display: flex; justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid #2A2560;
  }
  .ld-sk__brief-head .sk--line-sm { height: 12px; }
  .ld-sk__brief-head .a { width: 110px; }
  .ld-sk__brief-head .b { width: 70px; }
  .ld-sk__brief-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 24px;
  }
  .ld-sk__brief-row { display: flex; flex-direction: column; gap: 8px; }
  .ld-sk__brief-row .sk--line-sm { width: 60%; }
  .ld-sk__brief-row .sk--line-lg { width: 80%; height: 22px; }
  .ld-sk__brief-bar {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ld-sk__brief-bar .sk--line-sm { width: 50%; }
  .ld-sk__brief-bar .bar { height: 4px; width: 100%; }

  /* Timeline skeleton */
  .ld-sk__timeline {
    grid-column: 1 / -1;
    border-top: 1px solid #2A2560;
    border-bottom: 1px solid #2A2560;
    padding: 32px 8px;
    position: relative;
  }
  .ld-sk__timeline-line {
    position: absolute;
    left: 28px; right: 28px; top: 50%;
    height: 1px; background: #2A2560;
    transform: translateY(-1px);
  }
  .ld-sk__timeline-nodes {
    display: flex; justify-content: space-between; align-items: center;
    position: relative;
  }
  .ld-sk__node {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    flex: 1; min-width: 0;
  }
  .ld-sk__node .label { width: 80px; height: 10px; }
  .ld-sk__diamond {
    width: 18px; height: 18px;
    background: #1F1B47;
    transform: rotate(45deg);
    position: relative; overflow: hidden;
  }
  .ld-sk__diamond::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(42, 37, 96, 0.95) 50%,
      transparent 100%
    );
    animation: shimmer 1.6s ease-in-out infinite;
  }
  .ld-sk__node .meta { width: 40px; height: 8px; }

  /* Content body skeleton */
  .ld-sk__content {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; gap: 14px;
    max-width: 760px;
  }
  .ld-sk__h2 { height: 32px; width: 50%; margin-top: 16px; margin-bottom: 6px; }
  .ld-sk__content .sk--line { width: 100%; }
  .ld-sk__content .sk--line.s90 { width: 92%; }
  .ld-sk__content .sk--line.s70 { width: 70%; }
  .ld-sk__content .sk--line.s55 { width: 55%; }

  .ld-sk__code {
    margin-top: 18px;
    border: 1px solid #2A2560;
    background: #0A0826;
    overflow: hidden;
  }
  .ld-sk__code-head {
    padding: 10px 16px;
    border-bottom: 1px solid #2A2560;
    display: flex; gap: 12px; align-items: center;
    background: rgba(5,4,26,0.6);
  }
  .ld-sk__code-head .dot {
    width: 8px; height: 8px; background: #2A2560; flex-shrink: 0;
    border-radius: 50%;
  }
  .ld-sk__code-head .sk--line-sm { width: 140px; }
  .ld-sk__code-head .sk--line-sm.b { width: 70px; margin-left: auto; }
  .ld-sk__code-body {
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ld-sk__code-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 16px;
  }
  .ld-sk__code-row .num { height: 12px; background: #14113D; }
  .ld-sk__code-row .sk--line { height: 12px; }
  .ld-sk__code-row .sk--line.w95 { width: 95%; }
  .ld-sk__code-row .sk--line.w70 { width: 70%; }
  .ld-sk__code-row .sk--line.w50 { width: 50%; }
  .ld-sk__code-row .sk--line.w85 { width: 85%; }
  .ld-sk__code-row .sk--line.w40 { width: 40%; }

  /* ==========================================================================
     4. BADGES SKELETON
     ========================================================================== */
  .badges-sk {
    display: flex; flex-direction: column; gap: 28px;
  }
  .badges-sk__title-row {
    display: flex; justify-content: space-between; align-items: end;
    gap: 24px;
  }
  .badges-sk__title { width: 280px; height: 38px; }
  .badges-sk__subtitle { width: 180px; height: 14px; margin-top: 10px; }
  .badges-sk__count { width: 120px; height: 28px; }

  .badges-sk__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  .badge-sk {
    padding: 32px 20px 24px;
    display: flex; flex-direction: column; align-items: center;
    gap: 18px;
    background: #0A0826;
    border: 1px solid #2A2560;
  }
  .badge-sk__hex-wrap {
    position: relative;
    width: 140px; height: 160px;
  }
  .badge-sk__hex-outline {
    position: absolute; inset: 0;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: #2A2560;
  }
  .badge-sk__hex {
    position: absolute; inset: 2px;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: #1F1B47;
    overflow: hidden;
  }
  .badge-sk__hex::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(42, 37, 96, 0.95) 50%,
      transparent 100%
    );
    animation: shimmer 1.6s ease-in-out infinite;
  }
  .badge-sk__lines { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; }
  .badge-sk__lines .sk--line-lg { width: 70%; height: 18px; }
  .badge-sk__lines .sk--line-sm { width: 90px; height: 10px; }
  .badge-sk__pill {
    width: 80px; height: 18px;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 100%, 0 100%);
    background: #1F1B47;
    overflow: hidden; position: relative;
    margin-top: 4px;
  }
  .badge-sk__pill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(42, 37, 96, 0.95) 50%,
      transparent 100%
    );
    animation: shimmer 1.6s ease-in-out infinite;
  }

  /* Stagger shimmer phases per section so the page doesn't pulse in lockstep */
  .section:nth-child(2) .sk::after,
  .section:nth-child(2) .badge-sk__hex::after,
  .section:nth-child(2) .badge-sk__pill::after,
  .section:nth-child(2) .ld-sk__diamond::after { animation-delay: -0.2s; }
  .section:nth-child(3) .sk::after,
  .section:nth-child(3) .badge-sk__hex::after,
  .section:nth-child(3) .badge-sk__pill::after,
  .section:nth-child(3) .ld-sk__diamond::after { animation-delay: -0.4s; }
  .section:nth-child(4) .sk::after,
  .section:nth-child(4) .badge-sk__hex::after,
  .section:nth-child(4) .badge-sk__pill::after,
  .section:nth-child(4) .ld-sk__diamond::after { animation-delay: -0.6s; }

  /* Per-card stagger inside grids */
  .cards-sk .card-sk:nth-child(2) .sk::after { animation-delay: -0.15s; }
  .cards-sk .card-sk:nth-child(3) .sk::after { animation-delay: -0.3s; }
  .badges-sk__grid .badge-sk:nth-child(2) .sk::after,
  .badges-sk__grid .badge-sk:nth-child(2) .badge-sk__hex::after,
  .badges-sk__grid .badge-sk:nth-child(2) .badge-sk__pill::after { animation-delay: -0.2s; }
  .badges-sk__grid .badge-sk:nth-child(3) .sk::after,
  .badges-sk__grid .badge-sk:nth-child(3) .badge-sk__hex::after,
  .badges-sk__grid .badge-sk:nth-child(3) .badge-sk__pill::after { animation-delay: -0.4s; }
</style>
</head>
<body>
<div class="page">

  <header class="page__head">
    <h1 class="page__title">Skeleton Loading States</h1>
    <p class="page__subtitle">cyberlearn · 4 contextes · shimmer #1F1B47 → #2A2560</p>
  </header>

  <!-- 1. DASHBOARD -->
  <section class="section">
    <div class="section__tag">
      // DASHBOARD
      <span class="section__tag-meta">DashV2Hero · welcome + xp + continue</span>
    </div>
    <div class="dash-sk">
      <div class="card card--corners dash-sk__welcome">
        <span class="sk sk--line-xl"></span>
        <span class="sk sk--line"></span>
      </div>
      <div class="card dash-sk__xp">
        <span class="sk sk--line-sm"></span>
        <span class="sk sk--block"></span>
        <span class="sk sk--line"></span>
      </div>
      <div class="card card--corners dash-sk__continue">
        <span class="sk sk--block"></span>
        <div class="lines">
          <span class="sk sk--line-sm"></span>
          <span class="sk sk--line-lg"></span>
          <span class="sk sk--line"></span>
          <span class="sk sk--line short"></span>
        </div>
        <span class="sk cta"></span>
      </div>
    </div>
  </section>

  <!-- 2. LESSON CARDS -->
  <section class="section">
    <div class="section__tag">
      // LESSON CARDS
      <span class="section__tag-meta">CatalogGrid · 3 cards · 1fr × 3</span>
    </div>
    <div class="cards-sk">
      <div class="card card-sk">
        <span class="sk card-sk__cover"></span>
        <div class="card-sk__body">
          <span class="sk sk--line-lg"></span>
          <span class="sk sk--line"></span>
          <span class="sk sk--line short"></span>
          <div class="card-sk__pills">
            <span class="sk sk--pill"></span>
            <span class="sk sk--pill wider"></span>
            <span class="sk sk--pill narrow"></span>
          </div>
        </div>
      </div>
      <div class="card card-sk">
        <span class="sk card-sk__cover"></span>
        <div class="card-sk__body">
          <span class="sk sk--line-lg"></span>
          <span class="sk sk--line"></span>
          <span class="sk sk--line short"></span>
          <div class="card-sk__pills">
            <span class="sk sk--pill"></span>
            <span class="sk sk--pill wider"></span>
            <span class="sk sk--pill narrow"></span>
          </div>
        </div>
      </div>
      <div class="card card-sk">
        <span class="sk card-sk__cover"></span>
        <div class="card-sk__body">
          <span class="sk sk--line-lg"></span>
          <span class="sk sk--line"></span>
          <span class="sk sk--line short"></span>
          <div class="card-sk__pills">
            <span class="sk sk--pill"></span>
            <span class="sk sk--pill wider"></span>
            <span class="sk sk--pill narrow"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. LESSON DETAIL -->
  <section class="section">
    <div class="section__tag">
      // LESSON DETAIL
      <span class="section__tag-meta">hero + timeline + content + code</span>
    </div>
    <div class="ld-sk">
      <div class="ld-sk__hero">
        <span class="sk ld-sk__crumb"></span>
        <div class="ld-sk__tags">
          <span class="sk sk--pill"></span>
          <span class="sk sk--pill b"></span>
          <span class="sk sk--pill c"></span>
        </div>
        <span class="sk ld-sk__heading"></span>
        <span class="sk ld-sk__heading2"></span>
        <div class="ld-sk__lede">
          <span class="sk sk--line"></span>
          <span class="sk sk--line"></span>
          <span class="sk sk--line short"></span>
        </div>
      </div>

      <div class="card card--corners ld-sk__brief">
        <div class="ld-sk__brief-head">
          <span class="sk sk--line-sm a"></span>
          <span class="sk sk--line-sm b"></span>
        </div>
        <div class="ld-sk__brief-grid">
          <div class="ld-sk__brief-row">
            <span class="sk sk--line-sm"></span>
            <span class="sk sk--line-lg"></span>
          </div>
          <div class="ld-sk__brief-row">
            <span class="sk sk--line-sm"></span>
            <span class="sk sk--line-lg"></span>
          </div>
          <div class="ld-sk__brief-row">
            <span class="sk sk--line-sm"></span>
            <span class="sk sk--line-lg"></span>
          </div>
          <div class="ld-sk__brief-row">
            <span class="sk sk--line-sm"></span>
            <span class="sk sk--line-lg"></span>
          </div>
          <div class="ld-sk__brief-bar">
            <span class="sk sk--line-sm"></span>
            <span class="sk bar"></span>
          </div>
        </div>
      </div>

      <div class="ld-sk__timeline">
        <div class="ld-sk__timeline-line"></div>
        <div class="ld-sk__timeline-nodes">
          <div class="ld-sk__node">
            <span class="sk label"></span>
            <span class="ld-sk__diamond"></span>
            <span class="sk meta"></span>
          </div>
          <div class="ld-sk__node">
            <span class="sk label"></span>
            <span class="ld-sk__diamond"></span>
            <span class="sk meta"></span>
          </div>
          <div class="ld-sk__node">
            <span class="sk label"></span>
            <span class="ld-sk__diamond"></span>
            <span class="sk meta"></span>
          </div>
          <div class="ld-sk__node">
            <span class="sk label"></span>
            <span class="ld-sk__diamond"></span>
            <span class="sk meta"></span>
          </div>
          <div class="ld-sk__node">
            <span class="sk label"></span>
            <span class="ld-sk__diamond"></span>
            <span class="sk meta"></span>
          </div>
        </div>
      </div>

      <div class="ld-sk__content">
        <span class="sk ld-sk__h2"></span>
        <span class="sk sk--line"></span>
        <span class="sk sk--line s90"></span>
        <span class="sk sk--line"></span>
        <span class="sk sk--line s70"></span>

        <div class="ld-sk__code">
          <div class="ld-sk__code-head">
            <span class="dot"></span>
            <span class="sk sk--line-sm"></span>
            <span class="sk sk--line-sm b"></span>
          </div>
          <div class="ld-sk__code-body">
            <div class="ld-sk__code-row"><span class="num"></span><span class="sk sk--line w70"></span></div>
            <div class="ld-sk__code-row"><span class="num"></span><span class="sk sk--line w95"></span></div>
            <div class="ld-sk__code-row"><span class="num"></span><span class="sk sk--line w85"></span></div>
            <div class="ld-sk__code-row"><span class="num"></span><span class="sk sk--line w50"></span></div>
            <div class="ld-sk__code-row"><span class="num"></span><span class="sk sk--line w70"></span></div>
            <div class="ld-sk__code-row"><span class="num"></span><span class="sk sk--line w40"></span></div>
          </div>
        </div>
