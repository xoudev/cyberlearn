name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Without this block the token inherits the
# repository default, which can be read-write on every scope - handed to third
# party actions and to the Semgrep container on every pull request, including
# ones opened from a fork. No job here writes anything back to GitHub.
permissions:
  contents: read

env:
  # Skip @t3-oss/env-nextjs validation during CI steps that don't need runtime env
  SKIP_ENV_VALIDATION: "true"

jobs:
  # ─── 1. Format check (Biome) ───────────────────────────────────────────────
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Biome)
        run: pnpm format:check

  # ─── 2. Lint (ESLint + TypeScript-ESLint) ─────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-

      - name: Lint
        run: pnpm lint

  # ─── 3. Typecheck (tsc --noEmit) ──────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-

      - name: Typecheck
        run: pnpm typecheck

  # ─── 4. Unit tests (Vitest) ───────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-

      - name: Run tests
        run: pnpm test

  # ─── 5. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Create placeholder .env for web build
        # Next.js loads .env files via @next/env before spawning page-data
        # workers. Shell env vars (step-level env:) do not reach those workers.
        # Writing a .env file is the only reliable way to feed placeholders
        # through Next.js's own env loading pipeline.
        # All values satisfy the Zod schemas in apps/web/lib/env.ts.
        working-directory: apps/web
        run: |
          cat > .env << 'ENVEOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cyberlearn
          DIRECT_URL=postgresql://postgres:postgres@localhost:5432/cyberlearn
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key-for-ci-build
          RESEND_API_KEY=re_placeholder_key_for_ci_build
          RESEND_FROM_EMAIL=noreply@cyberlearn.app
          IP_SALT=placeholder-ip-salt-for-ci-build-32chars
          SUPABASE_HOOK_SECRET=placeholder-hook-secret-ci
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci
          NEXT_PUBLIC_SITE_URL=https://cyberlearn.app
          NEXT_PUBLIC_ADMIN_URL=https://admin.cyberlearn.app
          ENVEOF

      - name: Build
        run: pnpm build

  # ─── 6. Runtime integrity ─────────────────────────────────────────────────
  verify-runtimes:
    name: Runtime integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify Pyodide runtime integrity (SHA-256)
        run: bash scripts/verify-runtimes.sh

  # ─── 6b. Lesson diagrams survive the MDX pipeline ─────────────────────────
  # The children of <Diagram> are parsed as markdown before mermaid ever sees
  # them, so a label written [x](y) arrives as a link and *mot* as an <em>. The
  # diagram then draws wrong, or not at all, with nothing in the logs. This
  # replays the lesson page's own remark/rehype chain over every diagram in
  # content/lessons and fails on any that does not round-trip.
  lesson-diagrams:
    name: Lesson diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lesson diagrams
        run: pnpm --filter @cyberlearn/web content:diagrams

  # ─── 7. Auth hook signature verification (Deno unit test) ─────────────────
  # Synthetic proof that the custom-access-token hook authenticates GoTrue's
  # Standard Webhooks signature: valid -> accepted, invalid/absent/expired ->
  # rejected. Signs with the same library GoTrue uses, so "valid accepted"
  # proves we won't reject genuine auth calls.
  hook-verify:
    name: Auth hook signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Verify hook signature logic (verify + handler, both modes)
        run: deno test --allow-net supabase/functions/custom-access-token/

  # ─── 8. Integration tests (RLS / IDOR / storage) ──────────────────────────
  # Runs the db integration specs against a disposable Supabase local stack
  # (`supabase start`). Uses ONLY the fixed local dev keys minted by the CLI -
  # never production secrets. NOT (yet) a required status check: kept advisory
  # until a stable green window + the sabotage→red proof.
  integration:
    name: Integration (RLS/IDOR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Pinned: the `latest` CLI runs an "Updating vector buckets" step on
          # `start` that 409s in CI (S3 Vectors, a 2026 feature). This stable
          # 2025 release predates it.
          version: 2.64.0

      - name: Start Supabase local stack
        # Exclude services the integration tests don't need (saves image pulls).
        run: supabase start -x studio,imgproxy,vector,logflare

      - name: Export local stack env (exact names the tests read)
        run: |
          supabase status -o json > /tmp/sb-status.json
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' /tmp/sb-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' /tmp/sb-status.json)" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
          echo "DIRECT_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: Provision schema (Prisma migrations)
        run: pnpm --filter @cyberlearn/db exec prisma migrate deploy

      - name: Provision storage buckets
        # RLS is no longer applied here: the 20260610200000_rls_baseline migration
        # folded post_prisma_rls.sql into the chain, so `migrate deploy` above
        # already applied it. The step below PROVES it did.
        run: |
          # Private buckets (public=false), mirroring prod so storage RLS asserts the right scenario.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into storage.buckets (id, name, public) values ('certificates', 'certificates', false) on conflict (id) do nothing;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into storage.buckets (id, name, public) values ('avatars', 'avatars', false) on conflict (id) do nothing;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into storage.buckets (id, name, public) values ('lesson-covers', 'lesson-covers', false) on conflict (id) do nothing;"

      - name: Assert RLS coverage (applied by migrate deploy alone)
        # Gate 1: no public table without RLS. Allowlist: _prisma_migrations is
        # Prisma's own tracking table (no RLS by design; deliberately NOT
        # hardened, since enabling RLS on it could break migrate deploy itself).
        # Gate 2: tripwire on the policy count: >= the 56 baseline policies.
        # Deliberately >=, not ==, so adding policies needs no CI edit; a DROP
        # that regresses the count below the baseline still fails loudly.
        # Both gates are fail-closed: `if ! [ ... ]` treats an empty/non-numeric
        # psql result (connection error) as a failure, never as a pass.
        # Behavior (not just existence) stays proven by the RLS/IDOR tests below.
        run: |
          EXPOSED=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -c "SELECT coalesce(string_agg(tablename, ', '), '') FROM pg_tables WHERE schemaname = 'public' AND NOT rowsecurity AND tablename NOT IN ('_prisma_migrations');")
          if ! [ -z "$EXPOSED" ]; then
            echo "::error::public tables without RLS: $EXPOSED"; exit 1
          fi
          COUNT=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -c "SELECT count(*) FROM pg_policies WHERE schemaname = 'public';")
          if ! [ "$COUNT" -ge 56 ]; then
            echo "::error::pg_policies count regressed or unreadable: '$COUNT' (expected >= 56)"; exit 1
          fi
          echo "RLS coverage OK: no exposed table, $COUNT policies"

      - name: Seed database
        run: pnpm --filter @cyberlearn/db db:seed

      - name: Assert no schema/DB drift (no leftover column DEFAULTs)
        # Proves the gen_random_uuid() drift on the challenge id columns is gone:
        # a DB->schema diff that still needed a DROP DEFAULT would mean residual
        # drift. Targeted on DROP DEFAULT so unrelated diffs don't fail this.
        working-directory: packages/db
        run: |
          DIFF=$(pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script)
          echo "----- migrate diff (DB -> schema) -----"
          echo "$DIFF"
          if echo "$DIFF" | grep -qiE 'DROP DEFAULT'; then
            echo "::error::residual column DEFAULT drift detected"; exit 1
          fi
          echo "no DEFAULT drift ✅"

      - name: Run integration tests (RLS / IDOR / storage)
        run: pnpm --filter @cyberlearn/db test:integration

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  # ─── 9. Secrets scan (gitleaks) ────────────────────────────────────────────
  # Scans the FULL git history for committed secrets, not just the diff:
  # a key leaked five commits ago is just as burned as one leaked today.
  # Direct CLI (pinned) instead of gitleaks-action: the action only scans PR
  # commits and needs extra API permissions; the CLI is deterministic.
  # Allowlist (pedagogical demo tokens, CI placeholders) lives in .gitleaks.toml.
  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Piping the download straight into tar executes whatever the endpoint
        # returns. The archive is verified against the SHA-256 published in the
        # release's checksums file before anything is unpacked, so a swapped
        # asset or a hijacked redirect fails the job instead of running as root.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$ARCHIVE"
          gitleaks version

      - name: Scan full git history
        run: gitleaks git --no-banner --redact --verbose .

  # ─── 10. SAST (Semgrep) ──────────────────────────────────────────────────────
  # Static analysis with the curated default + TypeScript/React rulesets.
  # Vendored runtimes and design mockups are excluded via .semgrepignore.
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned by digest: `semgrep/semgrep` alone means `:latest`, so every run
      # pulls whatever was pushed last and executes it over the checkout. The
      # rulesets are still fetched fresh at scan time, so pinning the image
      # costs no detection coverage. Bump deliberately.
      image: semgrep/semgrep@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so Semgrep can diff this change against its baseline.
          fetch-depth: 0

      - name: Semgrep scan
        # Diff-aware scan: only findings introduced by this change fail the build.
        # The hosted rulesets (p/default etc.) update on their own, so without a
        # baseline they flag pre-existing, unchanged code and break CI with no
        # change on our side. --baseline-commit scopes --error to the diff while
        # still gating newly written code. Baseline is the PR base on a pull
        # request, or the previous commit on a push; a full scan is the fallback
        # when no valid baseline exists.
        # BASE is passed via env (never interpolated into the shell) to avoid
        # script injection.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Diff-aware Semgrep scan against baseline $BASE"
            semgrep scan --error --baseline-commit "$BASE" \
              --config p/default --config p/typescript --config p/react
          else
            echo "No valid baseline ($BASE); running a full scan"
            semgrep scan --error \
              --config p/default --config p/typescript --config p/react
          fi
