name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip @t3-oss/env-nextjs validation during CI steps that don't need runtime env
  SKIP_ENV_VALIDATION: "true"

jobs:
  # ─── 1. Format check (Biome) ───────────────────────────────────────────────
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Biome)
        run: pnpm format:check

  # ─── 2. Lint (ESLint + TypeScript-ESLint) ─────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-

      - name: Lint
        run: pnpm lint

  # ─── 3. Typecheck (tsc --noEmit) ──────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-

      - name: Typecheck
        run: pnpm typecheck

  # ─── 4. Unit tests (Vitest) ───────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-

      - name: Run tests
        run: pnpm test

  # ─── 5. Build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cyberlearn/db db:generate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Create placeholder .env for web build
        # Next.js loads .env files via @next/env before spawning page-data
        # workers. Shell env vars (step-level env:) do not reach those workers.
        # Writing a .env file is the only reliable way to feed placeholders
        # through Next.js's own env loading pipeline.
        # All values satisfy the Zod schemas in apps/web/lib/env.ts.
        working-directory: apps/web
        run: |
          cat > .env << 'ENVEOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cyberlearn
          DIRECT_URL=postgresql://postgres:postgres@localhost:5432/cyberlearn
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key-for-ci-build
          RESEND_API_KEY=re_placeholder_key_for_ci_build
          RESEND_FROM_EMAIL=noreply@cyberlearn.app
          IP_SALT=placeholder-ip-salt-for-ci-build-32chars
          SUPABASE_HOOK_SECRET=placeholder-hook-secret-ci
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci
          NEXT_PUBLIC_SITE_URL=https://cyberlearn.app
          NEXT_PUBLIC_ADMIN_URL=https://admin.cyberlearn.app
          ENVEOF

      - name: Build
        run: pnpm build

  # ─── 6. Runtime integrity ─────────────────────────────────────────────────
  verify-runtimes:
    name: Runtime integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Pyodide runtime integrity (SHA-256)
        run: bash scripts/verify-runtimes.sh
