name: Deploy Supabase functions

# Merging a change under supabase/functions/** used to ship nothing at all. The
# Vercel build runs `next build`, which does not know these files exist, and no
# job here touched them either - so the deployed function stayed whatever
# version was last pushed by hand from someone's machine.
#
# That gap has already cost a fix. The custom-access-token hook sits on the JWT
# issuance path, it was rewritten to stop downloading a client over the network
# on every cold start, the change reached main - and logins stayed slow,
# because the old code was still the one running. Nothing failed and nothing
# reported it: the repository and production had simply drifted apart.
#
# Same shape as migrate.yml: the change lands as soon as it reaches main, from
# the cloud, with no checkout on anyone's machine.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# Two deploys of the same function at once would race over which one wins, and
# unlike CI a queued run must not be cancelled - it may carry a version the
# newer run does not.
concurrency:
  group: deploy-functions-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned rather than @latest: this job deploys to production, and the CLI
  # decides how functions are bundled.
  SUPABASE_CLI: supabase@2.117.0

jobs:
  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    # Lets the repository require a manual approval before production is
    # touched, under Settings -> Environments -> production.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fail here rather than inside the CLI with an authentication error that
      # reads like the token is wrong when it is simply absent.
      - name: Check the access token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at https://supabase.com/dashboard/account/tokens and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # The project ref is not a secret - it is the subdomain the browser
      # already talks to - and `supabase link` recorded it in the repository.
      # The secret is there only as an override, for the day that file is
      # gitignored the way the CLI intends.
      - name: Resolve the project ref
        env:
          OVERRIDE: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          ref="$OVERRIDE"
          if [ -z "$ref" ] && [ -f supabase/.temp/project-ref ]; then
            ref="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          fi
          if [ -z "$ref" ]; then
            echo "::error::No project ref. supabase/.temp/project-ref is missing, so set a SUPABASE_PROJECT_REF secret to the subdomain of the project URL (https://<ref>.supabase.co)."
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      # Every function, not one by name: a second function added later must not
      # inherit the silence this workflow exists to end.
      #
      # verify_jwt is left to supabase/config.toml, which pins it to false for
      # this hook on purpose - GoTrue calls it with a Standard Webhooks
      # signature rather than a user JWT, so requiring a JWT would reject every
      # call and break sign-in.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "$SUPABASE_CLI" functions deploy --project-ref "$PROJECT_REF" --use-api

      # A deploy reporting success does not prove the hook is callable. If it
      # came back with JWT verification on, nothing breaks here - it breaks at
      # the next login, for everyone. Read the setting back instead.
      - name: Check the hook is deployed and still accepts unauthenticated calls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes "$SUPABASE_CLI" functions list \
            --project-ref "$PROJECT_REF" --output json > functions.json
          hook="$(jq -c 'if type == "array" then . else .functions // [] end
                         | map(select(.slug == "custom-access-token")) | first' functions.json)"
          if [ -z "$hook" ] || [ "$hook" = "null" ]; then
            echo "::error::custom-access-token is not in the deployed function list, although the deploy reported success."
            cat functions.json
            exit 1
          fi
          # `// "absent"` would be wrong here: jq treats false as empty, so a
          # correctly configured hook would read as absent.
          verify="$(printf '%s' "$hook" | jq -r 'if has("verify_jwt") then (.verify_jwt | tostring) else "absent" end')"
          if [ "$verify" = "true" ]; then
            echo "::error::custom-access-token was deployed with verify_jwt enabled. GoTrue signs its call as a webhook, not with a user JWT, so every login would be rejected. Check [functions.custom-access-token] in supabase/config.toml."
            exit 1
          fi
          # "absent" means the CLI stopped reporting the field, not that the
          # hook is misconfigured - worth saying, not worth failing a deploy
          # that has already landed.
          if [ "$verify" != "false" ]; then
            echo "::warning::Could not read verify_jwt back from the CLI (got \"$verify\"). Confirm it under Edge Functions in the dashboard."
          fi
