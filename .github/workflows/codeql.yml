name: CodeQL

# The repository used CodeQL's default setup, which cannot skip a path. This
# advanced setup scans the same languages (JavaScript and TypeScript, Python,
# the Actions workflows) with .github/codeql/codeql-config.yml, which leaves
# out the third-party runtimes served to the browser.
#
# The default setup is off (switched off on 25 November 2026): GitHub refuses a
# workflow's results while it is on. Turning it back on would silently stop
# this workflow from reporting.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 05:23 UTC: new queries reach code nobody has touched.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
