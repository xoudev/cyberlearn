<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Hexagon background -->
  <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" fill="#0A0826" stroke="#0AFFD4" stroke-width="1.5" opacity="0.9"/>
  <polygon points="40,10 66,25 66,55 40,70 14,55 14,25" fill="none" stroke="#0AFFD4" stroke-width="0.5" opacity="0.3"/>
  <!-- Footstep icon -->
  <ellipse cx="33" cy="36" rx="5" ry="7" fill="#0AFFD4" opacity="0.9" transform="rotate(-15,33,36)"/>
  <ellipse cx="47" cy="44" rx="5" ry="7" fill="#0AFFD4" opacity="0.6" transform="rotate(-15,47,44)"/>
  <ellipse cx="31" cy="28" rx="2" ry="2.5" fill="#0AFFD4" opacity="0.7" transform="rotate(-15,31,28)"/>
  <ellipse cx="35" cy="26" rx="2" ry="2.5" fill="#0AFFD4" opacity="0.7" transform="rotate(-15,35,26)"/>
  <ellipse cx="39" cy="25" rx="2" ry="2.5" fill="#0AFFD4" opacity="0.7" transform="rotate(-15,39,25)"/>
</svg>
